name: Release Deploid

on:
  release:
    types: [created]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create distribution package
        run: |
          mkdir -p dist
          # Create a zip file of the entire repository
          zip -r dist/deploid-${{ github.event.release.tag_name }}.zip . -x "*.git*" "dist/*" ".github/*"

      - name: Update installer script
        run: |
          # Get the release version
          VERSION="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"

          # Create a copy of the installer script
          cp install.sh dist/install.sh

          # Update the download URL in the installer script
          sed -i "s|https://github.com/yourusername/deploid/archive/main.zip|https://github.com/${REPO}/releases/download/${VERSION}/deploid-${VERSION}.zip|g" dist/install.sh
          sed -i "s|deploid-main|deploid-${VERSION}|g" dist/install.sh

          # Create a version-specific installer
          cp dist/install.sh dist/install-${VERSION}.sh

      - name: Update download page
        run: |
          # Get the release version
          VERSION="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"

          # Create a copy of the download page
          cp download.html dist/index.html

          # Update URLs in the download page
          sed -i "s|https://example.com/deploid/install.sh|https://github.com/${REPO}/releases/download/${VERSION}/install.sh|g" dist/index.html
          sed -i "s|https://github.com/yourusername/deploid|https://github.com/${REPO}|g" dist/index.html

          # Add version information
          sed -i "s|<h1>Download Deploid</h1>|<h1>Download Deploid ${VERSION}</h1>|g" dist/index.html

          # Create a pages directory for GitHub Pages
          mkdir -p pages
          cp dist/index.html pages/

          # Create a versions directory to list all versions
          mkdir -p pages/versions
          echo "# Deploid Versions" > pages/versions/index.md
          echo "" >> pages/versions/index.md
          echo "## Latest Release: ${VERSION}" >> pages/versions/index.md
          echo "" >> pages/versions/index.md
          echo "### Installation" >> pages/versions/index.md
          echo '```bash' >> pages/versions/index.md
          echo "curl -sSL https://github.com/${REPO}/releases/download/${VERSION}/install.sh | bash" >> pages/versions/index.md
          echo '```' >> pages/versions/index.md

          # Save version info for GitHub Pages
          echo "${VERSION}" > pages/latest-version.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/deploid-${{ github.event.release.tag_name }}.zip
            dist/install.sh
            dist/install-${{ github.event.release.tag_name }}.sh
            dist/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-content
          path: pages/

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    # Add concurrency to ensure only one deployment happens at a time
    concurrency:
      group: pages
      cancel-in-progress: false
    # Note: This job creates and updates the gh-pages branch
    # To use this for GitHub Pages:
    # 1. Go to your repository settings
    # 2. Navigate to Pages section
    # 3. Select "Deploy from a branch" under Source
    # 4. Select "gh-pages" branch and "/ (root)" folder
    # 5. Click Save
    steps:
      # Add a step to create a deployment branch
      - name: Checkout code for pages
        uses: actions/checkout@v4
        with:
          ref: main # Use your default branch here

      - name: Download GitHub Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-content
          path: pages

      # Optional: Create or update gh-pages branch
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Deploy to gh-pages branch
        run: |
          # Create gh-pages branch if it doesn't exist
          git checkout -B gh-pages

          # Remove existing files but keep .git directory
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} \;

          # Debug: List contents of current directory and pages directory
          echo "Current directory contents:"
          ls -la
          echo "Pages directory contents (if exists):"
          ls -la pages || echo "Pages directory not found"

          # Create a simple index.html if pages directory doesn't exist or is empty
          if [ ! -d "pages" ] || [ -z "$(ls -A pages 2>/dev/null)" ]; then
            echo "Creating a basic index.html file since pages directory is empty or missing"
            mkdir -p pages
            VERSION="${{ github.event.release.tag_name }}"
            REPO="${{ github.repository }}"

            # Create index.html with multiple echo statements instead of a heredoc
            echo '<!DOCTYPE html>' > pages/index.html
            echo '<html>' >> pages/index.html
            echo '<head>' >> pages/index.html
            echo "    <title>Deploid - $VERSION</title>" >> pages/index.html
            echo '    <meta charset="UTF-8">' >> pages/index.html
            echo '    <meta name="viewport" content="width=device-width, initial-scale=1.0">' >> pages/index.html
            echo '    <style>' >> pages/index.html
            echo '        body { font-family: Arial, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }' >> pages/index.html
            echo '        h1 { color: #2c3e50; }' >> pages/index.html
            echo '        .download-btn { display: inline-block; background-color: #3498db; color: white; padding: 12px 24px;' >> pages/index.html
            echo '                        text-decoration: none; border-radius: 4px; font-weight: bold; margin: 20px 0; }' >> pages/index.html
            echo '        .download-btn:hover { background-color: #2980b9; }' >> pages/index.html
            echo '    </style>' >> pages/index.html
            echo '</head>' >> pages/index.html
            echo '<body>' >> pages/index.html
            echo "    <h1>Download Deploid $VERSION</h1>" >> pages/index.html
            echo '    <p>Deploid is an AI agent for DevOps that makes deployments easy and fun.</p>' >> pages/index.html
            echo '' >> pages/index.html
            echo '    <h2>Quick Install</h2>' >> pages/index.html
            echo '    <p>You can install Deploid with a single command:</p>' >> pages/index.html
            echo "    <pre>curl -sSL https://github.com/$REPO/releases/download/$VERSION/install.sh | bash</pre>" >> pages/index.html
            echo '' >> pages/index.html
            echo '    <p>Or download the installer directly:</p>' >> pages/index.html
            echo "    <a href=\"https://github.com/$REPO/releases/download/$VERSION/install.sh\" class=\"download-btn\">Download Installer</a>" >> pages/index.html
            echo '' >> pages/index.html
            echo '    <h2>Source Code</h2>' >> pages/index.html
            echo "    <p>View the source code on <a href=\"https://github.com/$REPO\">GitHub</a>.</p>" >> pages/index.html
            echo '' >> pages/index.html
            echo '    <hr>' >> pages/index.html
            echo "    <p><small>Generated by GitHub Actions for release $VERSION</small></p>" >> pages/index.html
            echo '</body>' >> pages/index.html
            echo '</html>' >> pages/index.html
          fi

          # Copy pages content to root (with error handling)
          echo "Copying pages content to root directory"
          cp -r pages/* . || echo "Warning: Copy operation failed, but continuing"
          rm -rf pages

          # Make sure we have at least one file to commit
          if [ -z "$(ls -A | grep -v '.git')" ]; then
            echo "No files to commit, creating a placeholder"
            echo "# Deploid ${{ github.event.release.tag_name }}" > README.md
            echo "Visit https://github.com/${{ github.repository }}/releases for downloads" >> README.md
          fi

          # Commit and push changes
          git add .
          git commit -m "Deploy to GitHub Pages for release ${{ github.event.release.tag_name }}"
          git push -f origin gh-pages

          echo "✅ Deployment to gh-pages branch complete!"
          echo "🌐 Your site will be available at: https://${{ github.repository_owner }}.github.io/$(echo '${{ github.repository }}' | cut -d'/' -f2)/"
          echo "⚠️ Note: It may take a few minutes for the changes to be visible."
          echo "📋 To configure GitHub Pages, go to your repository settings and select the gh-pages branch as the source."

# The gh-pages branch will be used for GitHub Pages
# No need for a separate GitHub Pages deployment job since we're using branch-based deployment
